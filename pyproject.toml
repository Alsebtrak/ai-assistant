[project]
name = "ai-assistant"
version = "0.1.0"
description = "Personal AI assistant: memory, documents, calendar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
