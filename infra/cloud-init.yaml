#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - ufw
  - fail2ban
  - rclone

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /home/ubuntu/ai_assistant
  - chown ubuntu:ubuntu /home/ubuntu/ai_assistant
  # Yandex Cloud без IPv6: без этого apt и curl уходят в недоступный IPv6
  - echo 'precedence ::ffff:0:0/96  100' >> /etc/gai.conf
  # Основной IP api.telegram.org из РФ недоступен, этот — работает
  - grep -q 'api.telegram.org' /etc/hosts || echo '149.154.167.220 api.telegram.org' >> /etc/hosts
